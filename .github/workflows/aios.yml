# Ovyero Governance — GitHub Actions workflow
# Drop this file into .github/workflows/aios.yml in any repo you want to govern.
#
# Setup (one time):
#   1. Go to your repo: Settings > Secrets and variables > Actions > New secret
#      Name: AIOS_API_KEY   Value: <your key from the Ovyero dashboard>
#   2. Commit this file. The action runs on every pull request and on pushes to
#      your default branch (not on every branch push, so a PR is reviewed once).
#
# To block merges on a GATE finding, set the repo Variable AIOS_FAIL_ON_GATE=true.

name: Ovyero Governance

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  govern:
    name: Govern changed files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ovyero Governance
        env:
          INPUT_API-KEY: ${{ secrets.AIOS_API_KEY }}
          INPUT_SERVER-URL: https://aios-governance-staging.up.railway.app
          # Governance profile. Matches the API default exactly. Valid:
          #   production (default, strictest) · library · mixed · knowledge_base
          #   data_extraction · local_tooling · test_harness
          # An unknown name falls back to production (strict), never looser.
          INPUT_GOVERNANCE-PROFILE: production
          # Block merges on GATE? Set the repo Variable AIOS_FAIL_ON_GATE=true
          # (Settings > Secrets and variables > Actions > Variables). Default: report only.
          INPUT_FAIL-ON-GATE: ${{ vars.AIOS_FAIL_ON_GATE || 'false' }}
          # comment = post the verdict table on the PR; summary = job summary only.
          INPUT_COMMENT-MODE: comment
          INPUT_MAX-FILES: '200'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://aios-governance-staging.up.railway.app/gha-runner.js -o aios-runner.js
          node aios-runner.js